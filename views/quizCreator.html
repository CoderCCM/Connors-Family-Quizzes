<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Connor's Family Quizzes Quiz Creator</title>

    <!-- import the webpage's stylesheet -->
    <link rel="stylesheet" href="/creatorStyle.css" />

    <!-- import the webpage's client-side javascript file -->
    <script src="/creatorScript.js" defer></script>
  </head>
  <body>
    <header class="top">
      <div>
        <p class="brand">Connor&rsquo;s Family Quizzes</p>
        <h1>Quiz Creator</h1>
      </div>
      <button type="button" class="linkbtn" id="startOver">Start over</button>
    </header>

    <main>
      <p class="draftnote" id="draftNote" hidden>
        Picked up your unfinished draft from this device.
      </p>

      <div class="layout">
        <section class="panel basics">
          <h2><span class="step">1</span>Name</h2>
          <label class="field">
            <span>Quiz name</span>
            <input
              type="text"
              id="quizName"
              autocomplete="off"
              placeholder="2026 Thanksgiving Quiz"
            />
          </label>
        </section>

        <section class="panel look">
          <h2><span class="step">2</span>Look</h2>

          <div class="field">
            <span>Background color</span>
            <div class="colorrow">
              <input
                type="color"
                id="colorPicker"
                value="#24c94d"
                aria-label="Pick a background color"
              />
              <input
                type="text"
                id="backgroundColor"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
                placeholder="#24c94d (blank = green)"
              />
            </div>
            <div class="swatches" id="swatches"></div>
            <p class="hint" id="colorHint"></p>
          </div>

          <label class="field">
            <span>Background image <em>(optional)</em></span>
            <input
              type="text"
              id="backgroundImage"
              inputmode="url"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              placeholder="https://example.com/pattern.png"
            />
            <p class="hint" id="imageStatus"></p>
          </label>
        </section>

        <aside class="preview" aria-label="Preview">
          <h2>Preview</h2>
          <div class="phone">
            <div class="screen" id="pvScreen">
              <div class="pv-card" id="pvCard">
                <h3 id="pvTitle"></h3>
                <p class="pv-count" id="pvCount"></p>
                <p class="pv-question" id="pvQuestion"></p>
                <ul class="pv-opts" id="pvOptions"></ul>
                <div class="pv-next">Next</div>
              </div>
            </div>
          </div>
          <p class="hint">
            Tap into a question to preview it. Green is the correct answer; the
            red option just shows how a wrong answer looks.
          </p>
        </aside>

        <section class="panel questions">
          <h2>
            <span class="step">3</span>Questions
            <small id="qcount"></small>
          </h2>
          <div id="questionsDiv"></div>
          <button type="button" class="btn secondary wide" id="addQuestion">
            + Add question
          </button>

          <div class="problems" id="problems" hidden></div>
          <div class="result" id="result" hidden></div>
        </section>
      </div>

      <div class="publishbar">
        <span class="summary" id="publishSummary"></span>
        <button type="button" class="btn primary" id="publishBtn">
          Publish quiz
        </button>
      </div>
    </main>
  </body>
</html>
